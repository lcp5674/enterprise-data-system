spring:
  application:
    name: edams-integration-tests
    
  datasource:
    url: jdbc:mysql://localhost:3306/edams_test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: test
    password: test123
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        
  redis:
    host: localhost
    port: 6379
    database: 0
    timeout: 5000ms
    
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: edams-test
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 0

logging:
  level:
    root: INFO
    com.enterprise.edams: DEBUG
    org.springframework.cloud.contract: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

spring.cloud.contract:
  verifier:
    baseClassForTests: com.enterprise.edams.integration.BaseIntegrationTest
    testFramework: JUNIT5
    contractsMode: LOCAL
    contractsDirectory: classpath:contracts
    
test:
  containers:
    mysql:
      image: mysql:8.0
      database:
        name: edams_test
      username: test
      password: test123
      port: 3306
    redis:
      image: redis:7-alpine
      port: 6379

spring:
  application:
    name: edams-intelligent-analysis-test

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 0

analysis:
  task:
    default-batch-size: 5
    default-sample-row-count: 100
    max-concurrent-tasks: 3
  llm:
    default-timeout: 60000
    default-max-tokens: 2048
  cache:
    enabled: false

logging:
  level:
    root: WARN
    com.enterprise.edams.analysis: DEBUG

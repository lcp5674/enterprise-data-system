llm:
  providers:
    openai:
      enabled: true
      api-key: ${OPENAI_API_KEY:test-key}
      base-url: https://api.openai.com/v1
      models:
        - gpt-4
        - gpt-4-turbo
        - gpt-3.5-turbo
      timeout-ms: 30000
      max-retries: 3
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state-ms: 30000
        sliding-window-size: 5
        minimum-number-of-calls: 3
        slow-call-duration-threshold-ms: 5000

    zhipu:
      enabled: true
      api-key: ${ZHIPU_API_KEY:test-key}
      base-url: https://open.bigmodel.cn/api/paas/v4
      models:
        - glm-4
        - glm-4-flash
      timeout-ms: 30000
      max-retries: 3

    qwen:
      enabled: true
      api-key: ${QWEN_API_KEY:test-key}
      base-url: https://dashscope.aliyuncs.com/api/v1
      models:
        - qwen-turbo
        - qwen-plus
      timeout-ms: 30000
      max-retries: 3

  fallback:
    enabled: true
    strategy: priority
    priority:
      - openai
      - qwen
      - zhipu

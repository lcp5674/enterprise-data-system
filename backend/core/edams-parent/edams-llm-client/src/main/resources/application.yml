llm:
  providers:
    openai:
      enabled: true
      api-key: ${OPENAI_API_KEY:}
      base-url: https://api.openai.com/v1
      models:
        - gpt-4
        - gpt-4-turbo
        - gpt-4o
        - gpt-4o-mini
        - gpt-3.5-turbo
      timeout-ms: 120000
      max-retries: 3
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state-ms: 60000
        sliding-window-size: 10
        minimum-number-of-calls: 5
        slow-call-duration-threshold-ms: 2000

    zhipu:
      enabled: true
      api-key: ${ZHIPU_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas/v4
      models:
        - glm-4
        - glm-4-flash
        - glm-4-plus
        - glm-3-turbo
      timeout-ms: 120000
      max-retries: 3
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state-ms: 60000
        sliding-window-size: 10
        minimum-number-of-calls: 5
        slow-call-duration-threshold-ms: 2000

    qwen:
      enabled: true
      api-key: ${QWEN_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/api/v1
      models:
        - qwen-turbo
        - qwen-plus
        - qwen-max
        - qwen-max-longcontext
      timeout-ms: 120000
      max-retries: 3
      circuit-breaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state-ms: 60000
        sliding-window-size: 10
        minimum-number-of-calls: 5
        slow-call-duration-threshold-ms: 2000

  fallback:
    enabled: true
    strategy: priority
    priority:
      - openai
      - qwen
      - zhipu
